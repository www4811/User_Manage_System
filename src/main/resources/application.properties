spring.application.name=User_Manage_System

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/user_manage_system?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# SQL日志（调试用，生产环境建议关闭）
logging.level.org.springframework.jdbc.core=DEBUG